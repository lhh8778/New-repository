services:
  mysql:
    image: mysql:8.0
    container_name: campusmate-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campusmate_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - campusmate-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: campusmate-backend
    restart: always
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: campusmate_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - campusmate-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: campusmate-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - campusmate-net

volumes:
  mysql_data:

networks:
  campusmate-net:
    driver: bridge
